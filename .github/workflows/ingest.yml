name: Ingest YouTube catalogue

on:
  schedule:
    - cron: '17 3,15 * * *' # twice a day
  workflow_dispatch:
    inputs:
      reset:
        description: 'Wipe the catalogue first (1 = yes)'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: scripts/ingest
      - run: node ingest-youtube.mjs
        working-directory: scripts/ingest
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESET: ${{ inputs.reset }}
